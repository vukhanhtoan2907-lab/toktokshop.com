<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Đăng nhập</title>
    <style>
        /* Thiết lập kiểu dáng cơ bản cho toàn trang */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        /* Khung chứa logo và biểu mẫu đăng nhập */
        .container {
            display: flex;
            align-items: center;
            gap: 80px;
            padding: 20px;
        }
        /* Logo Facebook */
        .logo {
            color: #1877f2;
            font-size: 56px;
            font-weight: bold;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            letter-spacing: -2px;
        }
        /* Hộp đăng nhập */
        .login-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0,0,0,.1), 0 8px 16px rgba(0,0,0,.1);
            width: 396px;
        }
        /* Ô nhập liệu */
        .login-box input[type="text"],
        .login-box input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 17px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            margin-bottom: 12px;
            outline: none;
        }
        .login-box input:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px #e7f3ff;
        }
        /* Nút đăng nhập */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #1877f2;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .login-btn:hover { background: #166fe5; }
        /* Liên kết quên mật khẩu */
        .forgot {
            display: block;
            text-align: center;
            color: #1877f2;
            font-size: 14px;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .forgot:hover { text-decoration: underline; }
        /* Đường phân cách */
        .divider {
            border-top: 1px solid #dadde1;
            margin-bottom: 20px;
        }
        /* Nút tạo tài khoản mới */
        .create-btn {
            display: block;
            width: fit-content;
            margin: 0 auto;
            padding: 12px 16px;
            background: #42b72a;
            color: #fff;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }
        .create-btn:hover { background: #36a420; }
        /* Văn bản phía dưới */
        .bottom-text {
            margin-top: 28px;
            font-size: 14px;
            color: #1c1e21;
            text-align: center;
        }
        .bottom-text a {
            color: #1c1e21;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">facebook</div>

        <!-- Biểu mẫu đăng nhập -->
        <div class="login-box">
            <form id="loginForm" onsubmit="return xuLyDangNhap(event)">
                <!-- Ô nhập email/số điện thoại -->
                <input type="text" id="email" placeholder="Email hoặc số điện thoại" required>
                <!-- Ô nhập mật khẩu -->
                <input type="password" id="password" placeholder="Mật khẩu" required>
                <!-- Nút đăng nhập -->
                <button type="submit" class="login-btn">Đăng nhập</button>
            </form>
            <!-- Liên kết quên mật khẩu -->
            <a href="#" class="forgot">Quên mật khẩu?</a>
            <div class="divider"></div>
            <!-- Nút tạo tài khoản mới -->
            <a href="#" class="create-btn">Tạo tài khoản mới</a>
        </div>
    </div>

    <!-- Văn bản phía dưới -->
    <div class="bottom-text">
        <a href="#">Tạo Trang</a> dành cho người nổi tiếng, thương hiệu hoặc doanh nghiệp.
    </div>

    <script>
        // Hàm xử lý khi người dùng gửi biểu mẫu
        function xuLyDangNhap(event) {
            // Ngăn chặn hành vi gửi biểu mẫu mặc định
            event.preventDefault();
            // Lấy giá trị từ các ô nhập liệu
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            // In dữ liệu ra console (để troll)
            console.log('Email:', email);
            console.log('Mật khẩu:', password);
            // Chuyển hướng đến Facebook thật (tùy chọn)
            window.location.href = 'https://www.facebook.com/login';
            // Trả về false để ngăn gửi biểu mẫu
            return false;
        }
    </script>
</body>
</html>
